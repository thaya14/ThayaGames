<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golden Spot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --sky-top:#0a0e26;
    --sky-horizon:#2c3068;
    --floodlight:#ffe9a8;
    --gold:#f4b400;
    --gold-soft:#ffd866;
    --crimson:#e14b4b;
    --ink:#0a0d12;
    --panel:#12161f;
    --panel-2:#1a2029;
    --paper:#f1eee3;
    --muted:#8b93a3;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ink);color:var(--paper);overflow-x:hidden;}
  img{max-width:100%;}

  #app{
    max-width:760px;
    margin:0 auto;
    padding:22px 16px 48px;
    font-family:'Manrope',system-ui,sans-serif;
  }

  .topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
  }
  .wordmark{
    font-family:'Anton',sans-serif;
    font-size:clamp(26px,5vw,34px);
    letter-spacing:.5px;
    color:var(--gold);
    line-height:1;
    text-shadow:0 2px 12px rgba(244,180,0,.25);
  }
  .tagline{
    font-size:12px;
    color:var(--muted);
    margin-top:4px;
    letter-spacing:.3px;
  }
  .topbar-actions{ display:flex; gap:8px; }
  .icon-btn, .lb-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    color:var(--paper);
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:13px;
    padding:9px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s ease, transform .15s ease;
    white-space:nowrap;
  }
  .icon-btn{ padding:9px; }
  .icon-btn:hover, .lb-toggle:hover{ background:rgba(255,255,255,.11); }
  .icon-btn:active, .lb-toggle:active{ transform:scale(.94); }
  .icon-btn svg, .lb-toggle svg{ width:15px; height:15px; flex:none; display:block; }
  .icon-btn .off{ display:none; }
  .icon-btn.muted .on{ display:none; }
  .icon-btn.muted .off{ display:block; }

  .stage-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/10;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 30px 70px -25px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.07);
    cursor:crosshair;
    background:var(--sky-top);
    touch-action:manipulation;
  }
  .stage-wrap canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  @media (max-width:640px){
    .stage-wrap{ aspect-ratio:3/4; border-radius:16px; }
    #app{ padding:14px 10px 32px; }
    .wordmark{ font-size:24px; }
    .tagline{ font-size:11px; }
    .topbar{ flex-wrap:wrap; row-gap:10px; }
    .lb-toggle{ font-size:12px; padding:8px 12px; }
    .hud{ padding:6px 10px; }
    .hud-value{ font-size:20px; }
    .hud-sub{ font-size:9.5px; }
    .hud-label{ font-size:9px; }
  }
  @media (max-width:380px){
    .stage-wrap{ aspect-ratio:4/5.4; }
  }

  .fx-layer{ position:absolute; inset:0; pointer-events:none; overflow:visible; z-index:3; }
  .fx-text{
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) scale(.5);
    font-family:'Anton',sans-serif; font-size:clamp(28px,7vw,50px);
    letter-spacing:1px; opacity:0;
    animation:popText 1.1s cubic-bezier(.2,.8,.3,1) forwards;
    text-shadow:0 4px 18px rgba(0,0,0,.5);
  }
  .fx-text.goal{ color:var(--gold); }
  .fx-text.save{ color:var(--crimson); }
  @keyframes popText{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.4); }
    18%{ opacity:1; transform:translate(-50%,-50%) scale(1.12); }
    32%{ transform:translate(-50%,-50%) scale(1); }
    78%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-58%) scale(1); }
  }
  .fx-points{
    position:absolute; font-family:'Anton',sans-serif; color:var(--gold);
    font-size:20px; opacity:0; animation:floatUp 1s ease-out forwards;
  }
  @keyframes floatUp{ 0%{opacity:0; transform:translateY(0);} 15%{opacity:1;} 100%{opacity:0; transform:translateY(-34px);} }

  .hud{
    position:absolute; top:3.5%; padding:8px 14px; border-radius:14px;
    background:rgba(10,13,18,.55); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.09); z-index:3;
  }
  .hud-score{ left:3.5%; }
  .hud-misses{ right:3.5%; text-align:right; }
  .hud-label{ display:block; font-size:10px; letter-spacing:1.4px; color:var(--muted); font-weight:700; }
  .hud-value{ font-family:'Anton',sans-serif; font-size:clamp(22px,5vw,30px); color:var(--paper); line-height:1.1; font-variant-numeric:tabular-nums; }
  .hud-sub{ display:block; font-size:11px; color:var(--gold-soft); font-weight:700; margin-top:2px; white-space:nowrap; }
  .pips{ display:flex; gap:6px; justify-content:flex-end; margin-top:4px; }
  .pip{ width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,.35); transition:background .2s ease, border-color .2s ease; }
  .pip.used{ background:var(--crimson); border-color:var(--crimson); }

  .timer-wrap{
    position:absolute; left:50%; top:3.5%; transform:translateX(-50%);
    width:36%; height:7px; border-radius:999px; background:rgba(255,255,255,.15);
    overflow:hidden; z-index:3;
  }
  .timer-bar{
    height:100%; width:100%; background:linear-gradient(90deg,var(--gold-soft),var(--gold));
    transform-origin:left center;
  }
  .timer-bar.urgent{ background:linear-gradient(90deg,#ff9a6a,var(--crimson)); }

  .status{
    min-height:20px; text-align:center; margin:14px 0 0; font-size:14px; color:var(--muted); font-weight:600;
  }
  .status b{ color:var(--gold-soft); }

  .scrim{
    position:fixed; inset:0; background:rgba(5,7,10,.55); opacity:0; pointer-events:none;
    transition:opacity .25s ease; z-index:20;
  }
  .scrim.show{ opacity:1; pointer-events:auto; }

  .lb-panel{
    position:fixed; top:0; right:0; bottom:0; width:min(340px,88vw);
    background:var(--panel); border-left:1px solid rgba(255,255,255,.08);
    transform:translateX(100%); transition:transform .3s cubic-bezier(.2,.7,.3,1);
    z-index:21; display:flex; flex-direction:column; padding:22px 20px;
    box-shadow:-20px 0 50px rgba(0,0,0,.4);
  }
  .lb-panel.show{ transform:translateX(0); }
  .lb-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .lb-title{ font-family:'Anton',sans-serif; font-size:22px; color:var(--gold); letter-spacing:.5px; }
  .lb-close{ background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; line-height:1; padding:4px; }
  .lb-close:hover{ color:var(--paper); }
  .lb-sub{ font-size:12px; color:var(--muted); margin:0 0 16px; }
  .lb-list{ list-style:none; margin:0; padding:0; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:6px; }
  .lb-row{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; background:var(--panel-2); }
  .lb-rank{ width:24px; height:24px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:12px; background:rgba(255,255,255,.15); color:var(--paper); }
  .lb-row[data-rank="1"] .lb-rank{ background:var(--gold); color:#241a00; }
  .lb-row[data-rank="2"] .lb-rank{ background:#cdd3dd; color:#20242c; }
  .lb-row[data-rank="3"] .lb-rank{ background:#c8793f; color:#2a1608; }
  .lb-name{ flex:1; font-weight:700; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-score{ font-family:'Anton',sans-serif; font-size:16px; color:var(--gold-soft); font-variant-numeric:tabular-nums; }
  .lb-empty, .lb-unavail{ color:var(--muted); font-size:13px; padding:20px 4px; text-align:center; }

  .modal-overlay{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(5,7,10,.72); backdrop-filter:blur(3px); z-index:30; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-card{ width:min(380px,100%); background:var(--panel); border:1px solid rgba(255,255,255,.08); border-radius:20px; padding:28px 26px; text-align:center; box-shadow:0 30px 80px rgba(0,0,0,.5); }
  .modal-title{ font-family:'Anton',sans-serif; font-size:28px; color:var(--crimson); letter-spacing:.5px; }
  .modal-flavor{ font-size:13px; color:var(--muted); margin:6px 0 18px; }
  .modal-quote{ font-size:13px; font-style:italic; color:var(--gold-soft); margin:18px 4px 2px; line-height:1.55; }
  .modal-credit{ font-size:11px; color:var(--muted); margin-top:16px; letter-spacing:.3px; }
  .modal-credit b{ color:var(--gold-soft); font-weight:800; }
  .modal-score{ font-family:'Anton',sans-serif; font-size:56px; color:var(--gold); line-height:1; font-variant-numeric:tabular-nums; }
  .modal-score-label{ font-size:11px; letter-spacing:2px; color:var(--muted); font-weight:700; margin-bottom:4px; }
  .modal-best{ display:inline-block; margin-top:10px; font-size:12px; font-weight:800; color:#241a00; background:var(--gold); padding:4px 10px; border-radius:999px; letter-spacing:.4px; }
  .modal-form{ margin-top:20px; display:flex; flex-direction:column; gap:10px; }
  .modal-form input{ width:100%; padding:11px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.15); background:var(--panel-2); color:var(--paper); font-family:'Manrope'; font-size:14px; }
  .modal-form input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .btn{ font-family:'Manrope',sans-serif; font-weight:800; font-size:14px; border:none; border-radius:10px; padding:11px 16px; cursor:pointer; transition:transform .15s ease, filter .15s ease; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--gold); color:#241a00; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:rgba(255,255,255,.08); color:var(--paper); }
  .btn-ghost:hover{ background:rgba(255,255,255,.14); }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .modal-actions .btn{ flex:1; }
  .modal-saved{ margin-top:16px; font-size:13px; color:var(--gold-soft); font-weight:700; }

  a:focus-visible, button:focus-visible, input:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div>
      <div class="wordmark">GOLDEN SPOT</div>
      <div class="tagline">One shooter. One keeper. Three seconds to decide.</div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn muted" id="muteBtn" type="button" aria-label="Toggle music">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>
      </button>
      <button class="lb-toggle" id="lbOpenBtn" type="button" aria-haspopup="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M7 5H4a1 1 0 0 0-1 1v1a4 4 0 0 0 4 4M17 5h3a1 1 0 0 1 1 1v1a4 4 0 0 1-4 4"/></svg>
        Leaderboard
      </button>
    </div>
  </div>

  <div class="stage-wrap" id="stage" role="button" aria-label="Click anywhere to shoot; only inside the goal can score">
    <canvas id="glcanvas"></canvas>
    <div class="fx-layer" id="fxLayer"></div>

    <div class="hud hud-score">
      <span class="hud-label">SCORE</span>
      <span class="hud-value" id="scoreVal">0</span>
      <span class="hud-sub" id="nextVal">NEXT GOAL +5</span>
      <span class="hud-sub" id="bestVal">BEST 0</span>
    </div>
    <div class="hud hud-misses">
      <span class="hud-label">MISSES</span>
      <div class="pips"><span class="pip" id="pip1"></span><span class="pip" id="pip2"></span></div>
    </div>
    <div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>
  </div>

  <p class="status" id="statusLine">Loading the pitch…</p>
</div>

<div class="scrim" id="scrim"></div>
<aside class="lb-panel" id="lbPanel" aria-label="Leaderboard">
  <div class="lb-head">
    <span class="lb-title">Top Scores</span>
    <button class="lb-close" id="lbCloseBtn" type="button" aria-label="Close leaderboard">✕</button>
  </div>
  <p class="lb-sub">Best streaks from everyone who's taken the spot.</p>
  <ul class="lb-list" id="lbList"><li class="lb-empty">Loading…</li></ul>
</aside>

<div class="modal-overlay" id="modal">
  <div class="modal-card">
    <div class="modal-title">GAME OVER</div>
    <p class="modal-flavor" id="modalFlavor">Two in a row — the keeper had your number.</p>
    <div class="modal-score-label">FINAL SCORE</div>
    <div class="modal-score" id="modalScore">0</div>
    <div id="modalBestWrap"></div>
    <div id="modalNameWrap"></div>
    <p class="modal-quote" id="modalQuote"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modalLbBtn" type="button">View Leaderboard</button>
      <button class="btn btn-primary" id="modalRetryBtn" type="button">Try Again</button>
    </div>
    <p class="modal-credit">Built by <b>Blessing Thaya</b></p>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ============================= constants =============================
  var GOAL_W = 6.8, GOAL_H = 2.4, GOAL_BOTTOM = 0.12, GOAL_Z = -6;
  var GOAL_LEFT = -GOAL_W/2, GOAL_RIGHT = GOAL_W/2, GOAL_TOP = GOAL_BOTTOM+GOAL_H;
  var KICKER_Z = 4.4, BALL_IDLE = {x:0,y:0.12,z:3.7};
  var KEEPER_Z = GOAL_Z + 0.35;
  var ROUND_TIME = 3000;
  var BEST_KEY = 'goldenSpotBest3D';
  var MISSION_BASE = [3,5,7];
  var MISS_ALLOWANCE = 2;
  function missionTarget(i){
    return i < MISSION_BASE.length ? MISSION_BASE[i] : MISSION_BASE[MISSION_BASE.length-1] + (i-MISSION_BASE.length+1)*2;
  }
  function missionAttempts(i){ return missionTarget(i) + MISS_ALLOWANCE; }

  var state = { score:0, combo:0, missionGoals:0, missionMisses:0, best:0, missionIndex:0, shooting:false, gameOver:false };
  try { state.best = parseInt(localStorage.getItem(BEST_KEY),10) || 0; } catch(e){ state.best = 0; }

  // ============================= DOM refs =============================
  var stage = document.getElementById('stage');
  var canvasEl = document.getElementById('glcanvas');
  var fxLayer = document.getElementById('fxLayer');
  var scoreVal = document.getElementById('scoreVal');
  var nextVal = document.getElementById('nextVal');
  var bestVal = document.getElementById('bestVal');
  var pip1 = document.getElementById('pip1');
  var pip2 = document.getElementById('pip2');
  var statusLine = document.getElementById('statusLine');
  var timerBar = document.getElementById('timerBar');

  var modal = document.getElementById('modal');
  var modalScore = document.getElementById('modalScore');
  var modalFlavor = document.getElementById('modalFlavor');
  var modalQuote = document.getElementById('modalQuote');
  var modalBestWrap = document.getElementById('modalBestWrap');
  var modalNameWrap = document.getElementById('modalNameWrap');
  var modalRetryBtn = document.getElementById('modalRetryBtn');
  var modalLbBtn = document.getElementById('modalLbBtn');

  var lbPanel = document.getElementById('lbPanel');
  var lbList = document.getElementById('lbList');
  var scrim = document.getElementById('scrim');
  var lbOpenBtn = document.getElementById('lbOpenBtn');
  var lbCloseBtn = document.getElementById('lbCloseBtn');
  var muteBtn = document.getElementById('muteBtn');

  function updateHud(){
    scoreVal.textContent = state.score;
    var target = missionTarget(state.missionIndex);
    nextVal.textContent = 'MISSION ' + (state.missionIndex+1) + ' • ' + state.missionGoals + '/' + target + ' (+' + (5+state.combo) + ')';
    bestVal.textContent = 'BEST ' + state.best;
    pip1.classList.toggle('used', state.missionMisses >= 1);
    pip2.classList.toggle('used', state.missionMisses >= 2);
  }
  updateHud();

  // ============================= tween engine =============================
  var tweens = [];
  function addTween(duration, onUpdate, onDone){
    tweens.push({ start: performance.now(), duration: Math.max(1,duration), onUpdate: onUpdate, onDone: onDone });
  }
  function easeOutQuad(t){ return 1-(1-t)*(1-t); }
  function tickTweens(now){
    for(var i=tweens.length-1;i>=0;i--){
      var tw = tweens[i];
      var p = Math.min(1, (now-tw.start)/tw.duration);
      tw.onUpdate(p);
      if(p>=1){ tweens.splice(i,1); if(tw.onDone) tw.onDone(); }
    }
  }

  // ============================= three.js scene =============================
  var renderer = new THREE.WebGLRenderer({ canvas:canvasEl, antialias:true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0e26);
  scene.fog = new THREE.Fog(0x0a0e26, 11, 26);

  var camera = new THREE.PerspectiveCamera(45, 1.6, 0.1, 100);
  camera.position.set(0, 1.55, 9.2);
  camera.lookAt(0, 1.3, GOAL_Z);

  scene.add(new THREE.HemisphereLight(0x8fa6ff, 0x0f2a1c, 0.55));
  var ambient = new THREE.AmbientLight(0x9fb4ff, 0.35);
  scene.add(ambient);
  var rim = new THREE.DirectionalLight(0x9fd8ff, 0.55);
  rim.position.set(-5, 3.5, 6);
  scene.add(rim);

  function makeFloodlight(x){
    var g = new THREE.Group();
    var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,6,8), new THREE.MeshStandardMaterial({color:0x2a2e3a, roughness:.7}));
    pole.position.y = 3; pole.castShadow = false;
    g.add(pole);
    var lamp = new THREE.Mesh(new THREE.SphereGeometry(0.3,12,10), new THREE.MeshStandardMaterial({color:0xffe9a8, emissive:0xffe9a8, emissiveIntensity:1.6, roughness:.4}));
    lamp.position.y = 6.1;
    g.add(lamp);
    var spot = new THREE.SpotLight(0xffe9a8, 2.6, 26, Math.PI/6, 0.5, 1.4);
    spot.position.set(0,6.1,0);
    spot.target.position.set(-x*0.5, 0.5, GOAL_Z+1);
    spot.castShadow = true;
    spot.shadow.mapSize.set(1024,1024);
    g.add(spot); g.add(spot.target);
    g.position.set(x, 0, GOAL_Z-3.5);
    return g;
  }
  scene.add(makeFloodlight(-8.5));
  scene.add(makeFloodlight(8.5));

  // pitch
  function makePitchTexture(){
    var c = document.createElement('canvas'); c.width=c.height=256;
    var cx = c.getContext('2d');
    var stripes = 8, sw = c.width/stripes;
    for(var i=0;i<stripes;i++){
      cx.fillStyle = i%2===0 ? '#1d5c3f' : '#194f36';
      cx.fillRect(i*sw,0,sw,c.height);
    }
    var tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(5,8);
    return tex;
  }
  var pitch = new THREE.Mesh(
    new THREE.PlaneGeometry(40,40),
    new THREE.MeshStandardMaterial({ map:makePitchTexture(), roughness:.95 })
  );
  pitch.rotation.x = -Math.PI/2;
  pitch.receiveShadow = true;
  scene.add(pitch);

  var spot = new THREE.Mesh(new THREE.CircleGeometry(0.09,20), new THREE.MeshBasicMaterial({color:0xeef2ea}));
  spot.rotation.x = -Math.PI/2; spot.position.set(0,0.005,KICKER_Z-0.6);
  scene.add(spot);
  var arc = new THREE.Mesh(new THREE.RingGeometry(1.55,1.62,32,1,Math.PI*0.62,Math.PI*0.78), new THREE.MeshBasicMaterial({color:0xeef2ea, side:THREE.DoubleSide, transparent:true, opacity:.6}));
  arc.rotation.x = -Math.PI/2; arc.position.set(0,0.006,KICKER_Z-0.6);
  scene.add(arc);

  // goal — proper 3D profile: tubular posts, mitred corner joints, ground sockets
  var chalkMat = new THREE.MeshStandardMaterial({color:0xf4f7f1, roughness:.28, metalness:.35});
  var postR_ = 0.065;
  var postGeo = new THREE.CylinderGeometry(postR_,postR_,GOAL_H,18);
  var postL = new THREE.Mesh(postGeo, chalkMat); postL.position.set(GOAL_LEFT,GOAL_BOTTOM+GOAL_H/2,GOAL_Z); postL.castShadow=true;

  // synthesized cartoon-voice reaction — an original formant-synthesis "voice",
  // not derived from any recording: sawtooth "vocal cords" through swept
  // bandpass "formant" filters, with pitch-bend + vibrato per syllable.
  // synthesized cartoon "voice" — original formant synthesis, no recording:
  // a buzzy sawtooth source shaped through swept bandpass "formant" filters
  // (the two resonances that give a vowel its identity) with pitch bends,
  // strung into the syllables Ca-me-ra Wo-wo over ~3 seconds.
  function cartoonVowel(t, dur, p0, p1, f1a, f1b, f2a, f2b, vol){
    var end = t + dur;
    var osc = audioCtx.createOscillator(); osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(p0, t);
    osc.frequency.linearRampToValueAtTime(p1, end);

    var vib = audioCtx.createOscillator(); vib.type = 'sine'; vib.frequency.value = 18;
    var vibGain = audioCtx.createGain(); vibGain.gain.value = 4;
    vib.connect(vibGain).connect(osc.frequency);
    vib.start(t); vib.stop(end);

    var amp = audioCtx.createGain();
    amp.gain.setValueAtTime(0.0001, t);
    amp.gain.linearRampToValueAtTime(vol, t+dur*0.12);
    amp.gain.linearRampToValueAtTime(vol*0.85, t+dur*0.7);
    amp.gain.exponentialRampToValueAtTime(0.0001, end);

    var f1 = audioCtx.createBiquadFilter(); f1.type='bandpass'; f1.Q.value=13;
    f1.frequency.setValueAtTime(f1a, t); f1.frequency.linearRampToValueAtTime(f1b, end);
    var f2 = audioCtx.createBiquadFilter(); f2.type='bandpass'; f2.Q.value=16;
    f2.frequency.setValueAtTime(f2a, t); f2.frequency.linearRampToValueAtTime(f2b, end);
    var g1 = audioCtx.createGain(); g1.gain.value = 1.1;
    var g2 = audioCtx.createGain(); g2.gain.value = 0.55;

    osc.connect(f1); f1.connect(g1); g1.connect(amp);

  function cartoonNasal(t, dur, vol){

    var osc = audioCtx.createOscillator(); osc.type='sawtooth'; osc.frequency.value = 190;
    var f = audioCtx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 380;

  // original taunt (not anyone's real quote): "Eh, mira vos! Que papelon, campeon!"
  // ("Hey, look at that! What an embarrassment, champ!") — Argentine-flavored
  // mocking energy, written for this game, spoken by a wholly synthetic voice.
  function playCartoonVoice(delay){
    if(!audioCtx) return;
    var now = audioCtx.currentTime + delay;
    // "Eh" — sharp surprised open vowel
    cartoonVowel(now+0.00, 0.20, 380,480, 480,520, 1650,1700, 0.55);
    // "mi" (quick, unstressed) + "RA" (stressed, punchy)
    cartoonVowel(now+0.24, 0.10, 420,400, 300,320, 2100,2150, 0.32);
    cartoonVowel(now+0.36, 0.26, 460,540, 680,720, 1150,1200, 0.6);
    // "vos" — falling, closing the first exclamation
    cartoonVowel(now+0.66, 0.28, 500,300, 450,420, 900,850, 0.5);
    // "Que" — burst + punchy rising vowel
    cartoonBurst(now+1.02, 0.28);
    cartoonVowel(now+1.05, 0.24, 420,520, 500,540, 1700,1750, 0.55);
    // "pa" + "pe" (quick unstressed) into stressed swooping "LON"
    cartoonBurst(now+1.32, 0.2);
    cartoonVowel(now+1.35, 0.11, 400,380, 680,700, 1200,1250, 0.32);
    cartoonVowel(now+1.48, 0.10, 400,420, 500,520, 1700,1750, 0.34);
    cartoonVowel(now+1.60, 0.22, 460,560, 450,470, 840,820, 0.62);
    cartoonVowel(now+1.83, 0.24, 560,360, 470,460, 820,800, 0.58);

    cartoonVowel(now+2.19, 0.11, 420,400, 680,700, 1200,1250, 0.32);
    cartoonVowel(now+2.32, 0.10, 400,420, 500,520, 1700,1750, 0.32);

  var BPM = 128;
  var BEAT = 60/BPM;
  var BAR_BEATS = 4;
  var PROGRESSION = [
    { root:65.41,  third:82.41,  fifth:98.00  },
    { root:98.00,  third:123.47, fifth:146.83 },
    { root:110.00, third:130.81, fifth:164.81 },
    { root:87.31,  third:110.00, fifth:130.81 }
  ];
  var LOOP_LEN = BEAT * BAR_BEATS * PROGRESSION.length;
  function scheduleMusicLoop(){
    if(!musicPlaying || !audioCtx) return;
    var t0 = audioCtx.currentTime + 0.05;
    PROGRESSION.forEach(function(chord, barIdx){
      var barStart = t0 + barIdx*BAR_BEATS*BEAT;
      for(var beat=0; beat<BAR_BEATS; beat++){
        var t = barStart + beat*BEAT;
        var accent = beat===0;

        var kick = audioCtx.createOscillator(); kick.type='sine';
        kick.frequency.setValueAtTime(accent?135:112, t);
        kick.frequency.exponentialRampToValueAtTime(40, t+0.13);
        var kg = audioCtx.createGain();
        kg.gain.setValueAtTime(accent?0.5:0.36, t);
        kg.gain.exponentialRampToValueAtTime(0.001, t+0.2);
        kick.connect(kg).connect(musicGain); kick.start(t); kick.stop(t+0.22);

        var bassFreq = (beat===2 ? chord.fifth : chord.root) / 2;
        var bass = audioCtx.createOscillator(); bass.type='sawtooth'; bass.frequency.value=bassFreq;
        var bassF = audioCtx.createBiquadFilter(); bassF.type='lowpass'; bassF.frequency.value=460;
        var bg = audioCtx.createGain();
        bg.gain.setValueAtTime(0.0001,t);
        bg.gain.linearRampToValueAtTime(0.24, t+0.012);
        bg.gain.exponentialRampToValueAtTime(0.0001, t+BEAT*0.82);
        bass.connect(bassF).connect(bg).connect(musicGain); bass.start(t); bass.stop(t+BEAT);

        var hatT = t + BEAT/2;
        var hat = audioCtx.createBufferSource(); hat.buffer = noiseBuffer(0.045);
        var hatF = audioCtx.createBiquadFilter(); hatF.type='highpass'; hatF.frequency.value=6500;
        var hg = audioCtx.createGain();
        hg.gain.setValueAtTime(0.1, hatT); hg.gain.exponentialRampToValueAtTime(0.001, hatT+0.05);
        hat.connect(hatF).connect(hg).connect(musicGain); hat.start(hatT);
      }
      [0,2].forEach(function(beatIdx){
        var t = barStart + beatIdx*BEAT;
        [chord.root*2, chord.third*2, chord.fifth*2].forEach(function(freq){
          var osc = audioCtx.createOscillator(); osc.type='triangle'; osc.frequency.value=freq;
          var g = audioCtx.createGain();

  // ============================= shot logic =============================
  function randomZone(centerX){
    var hFrac = 0.45 + Math.random()*0.45;
    var h = GOAL_H * hFrac;
    var area = 0.5 * GOAL_W * GOAL_H;
    var w = Math.min(GOAL_W*0.98, area/h);
    var jitter = (Math.random()-0.5) * 0.8;
    var x = (centerX!==undefined ? centerX+jitter-w/2 : GOAL_LEFT+Math.random()*(GOAL_W-w));
    x = Math.max(GOAL_LEFT, Math.min(GOAL_RIGHT-w, x));
    var y = GOAL_BOTTOM + Math.random()*(GOAL_H-h);
    return { x:x, y:y, w:w, h:h };
  }
  function inZone(px,py,z){ return px>=z.x && px<=z.x+z.w && py>=z.y && py<=z.y+z.h; }
  function inGoal(px,py){ return px>=GOAL_LEFT && px<=GOAL_RIGHT && py>=GOAL_BOTTOM && py<=GOAL_TOP; }

  var roundTimer = null, roundActive = false;

  function setTimerActive(active){

    timerBar.classList.remove('urgent');
    if(!active){ timerBar.style.transition='none'; timerBar.style.width='0%'; return; }
    timerBar.style.transition = 'none';
    timerBar.style.width = '100%';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        timerBar.style.transition = 'width ' + ROUND_TIME + 'ms linear';
        timerBar.style.width = '0%';
      });
    });
    roundTimer = setTimeout(function(){
      if(roundActive){ roundActive = false; timeoutMiss(); }
    }, ROUND_TIME);
    setTimeout(function(){ if(roundActive) timerBar.classList.add('urgent'); }, ROUND_TIME-900);
  }

  function resetPoses(){
    kicker.group.position.set(0,0,KICKER_Z);
    kicker.rig.rotation.set(0,0,0);
    kicker.legR.rotation.set(0,0,0);
    keeper.group.position.set(keeperPatrolX,0,KEEPER_Z);
    keeper.rig.rotation.set(0,0,0);
    keeper.armL.rotation.set(0,0,0.15);
    keeper.armR.rotation.set(0,0,-0.15);
    keeper.tearL.visible = false; keeper.tearR.visible = false;
    keeper.tearL.position.y = 1.53; keeper.tearR.position.y = 1.53;

  function startRound(){
    if(state.gameOver) return;

  function onStageClick(e){
    if(state.shooting || state.gameOver || !roundActive) return;
    var rect = canvasEl.getBoundingClientRect();
    var cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
    var cy = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
    var ndcX = ((cx-rect.left)/rect.width)*2-1;
    var ndcY = -(((cy-rect.top)/rect.height)*2-1);
    raycaster.setFromCamera({x:ndcX,y:ndcY}, camera);
    var hit = raycaster.intersectObject(aimPlane)[0];
    if(!hit) return;

  stage.addEventListener('click', onStageClick);

  function takeShot(px, py){
    roundActive = false;
    clearTimeout(roundTimer);
    setTimerActive(false);
    state.shooting = true;
    idleFlags.kicker = false;

    addTween(420, function(p){
      var swing = p<0.5 ? -0.9*(p/0.5) : -0.9*(1-(p-0.5)/0.5);
      kicker.legR.rotation.x = swing;
      kicker.rig.rotation.x = -0.12*Math.sin(p*Math.PI);
    });

    var target = { x:px, y:Math.max(0.08,py), z:GOAL_Z };
    var start = { x:BALL_IDLE.x, y:BALL_IDLE.y, z:BALL_IDLE.z };
    var wasInGoal = inGoal(px,py);
    var zone = wasInGoal ? randomZone(keeperPatrolX) : null;

    if(wasInGoal){
      var zcx = zone.x+zone.w/2, zcy = zone.y+zone.h/2;
      idleFlags.keeper = false;
      var kFrom = { x:keeper.group.position.x, y:keeper.group.position.y };
      var leanZ = zcx < -0.3 ? 0.55 : (zcx > 0.3 ? -0.55 : 0);
      addTween(380, function(p){
        var e = easeOutQuad(p);
        keeper.group.position.x = kFrom.x + (zcx-kFrom.x)*e;
        keeper.group.position.y = kFrom.y + (Math.max(0,zcy-1.3))*e*0.4;
        keeper.rig.rotation.z = leanZ*e;
        keeper.armL.rotation.z = 0.15 + (-1.3-0.15)*e;
        keeper.armR.rotation.z = -0.15 + (1.3+0.15)*e;
      });
    }

    var arcHeight = wasInGoal ? 0.55 : 1.1;
    addTween(430, function(p){
      var e = easeOutQuad(p);
      ball.position.x = start.x + (target.x-start.x)*e;
      ball.position.z = start.z + (target.z-start.z)*e;
      ball.position.y = start.y + (target.y-start.y)*e + Math.sin(p*Math.PI)*arcHeight;
      ball.rotation.x += 0.35;
    }, function(){
      resolveShot(px,py,wasInGoal,zone);
    });
  }

  function afterOutcomePause(cb, ms){ setTimeout(cb, ms); }

  function chancesLeftText(){
    var left = MISS_ALLOWANCE - state.missionMisses;
    return left<=0 ? 'That was the last chance.' : left===1 ? 'One more miss ends it.' : left+' misses left this mission.';
  }

  function resolveShot(px, py, wasInGoal, zone){
    if(!wasInGoal){
      state.missionMisses += 1; state.combo = 0; updateHud();
      showFxText('WIDE!', 'save');
      statusLine.innerHTML = 'Off target. <b>' + chancesLeftText() + '</b>';
      handleMissFollowup();
      return;
    }
    var saved = inZone(px,py,zone);
    if(saved){
      idleFlags.keeper = false;
      var reachLeft = px < keeper.group.position.x;
      var catchGlove = reachLeft ? keeper.gloveL : keeper.gloveR;
      var farArmL = keeper.armL.rotation.z, farArmR = keeper.armR.rotation.z;
      var ballStart = ball.position.clone();
      var gloveTarget = new THREE.Vector3();
      addTween(220, function(p){
        var e = easeOutQuad(p);
        keeper.armL.rotation.z = farArmL + (reachLeft ? 0.95 : 0.6) * e;
        keeper.armR.rotation.z = farArmR - (reachLeft ? 0.6 : 0.95) * e;
        keeper.armL.rotation.x = -0.35 * e;
        keeper.armR.rotation.x = -0.35 * e;
        keeper.rig.rotation.x = -0.22 * e;
        keeper.rig.position.y = -0.05 * e;
        catchGlove.getWorldPosition(gloveTarget);
        ball.position.lerpVectors(ballStart, gloveTarget, e);
      }, function(){
        ball.followObj = catchGlove;
        shakeCamera(0.05, 220);
        spawnImpactBurst(gloveTarget, 0xffe9a8);
        var bScale = ball.scale.clone();
        addTween(300, function(p){
          var squash = 1 - Math.sin(p*Math.PI)*0.4;
          ball.scale.set(squash, 2-squash, squash);
        }, function(){ ball.scale.copy(bScale); });
        addTween(280, function(p){
          keeper.rig.position.y = -0.05 + Math.sin(p*Math.PI)*0.09;
        }, function(){ keeper.rig.position.y = 0; });
      });
      state.missionMisses += 1; state.combo = 0; updateHud();
      showFxText('SAVED!', 'save');
      statusLine.innerHTML = 'Saved! <b>' + chancesLeftText() + '</b>';
      handleMissFollowup();
    } else {
      state.combo += 1;
      var points = 4 + state.combo;
      state.score += points; state.missionGoals += 1;
      updateHud();
      showFxText('GOAL!', 'goal');
      floatPoints(points);
      playCheer();
      bulgeNet(px, py);
      ball.visible = false;

      var target = missionTarget(state.missionIndex);
      if(state.missionGoals >= target){
        state.missionIndex += 1;
        state.missionGoals = 0; state.missionMisses = 0;
        updateHud();
        setTimeout(function(){ showFxText('MISSION CLEAR!', 'goal'); }, 350);
        kickerDance();
        keeperCry();
        playMissionClearSting();
        var nextTarget = missionTarget(state.missionIndex);
        statusLine.innerHTML = 'Mission clear! Next: <b>' + nextTarget + ' goals out of ' + missionAttempts(state.missionIndex) + ' shots</b>.';
        afterOutcomePause(function(){ state.shooting=false; startRound(); }, 2000);
      } else {
        statusLine.innerHTML = 'GOAL! ' + state.missionGoals + '/' + target + ' — next one is worth <b>+' + (5+state.combo) + '</b>.';
        afterOutcomePause(function(){ state.shooting=false; startRound(); }, 900);
      }
    }
  }

  function kickerDance(){
    idleFlags.kicker = false;
    addTween(1400, function(p){
      kicker.rig.position.y = Math.abs(Math.sin(p*Math.PI*4)) * 0.1;
      kicker.rig.rotation.y = Math.sin(p*Math.PI*3) * 0.5;
      kicker.armL.rotation.z = 0.3 + Math.sin(p*Math.PI*5) * 1.0;
      kicker.armR.rotation.z = -0.3 - Math.sin(p*Math.PI*5 + 1) * 1.0;
    }, function(){
      kicker.rig.position.y = 0; kicker.rig.rotation.y = 0;
      kicker.armL.rotation.z = 0; kicker.armR.rotation.z = 0;

  }

  function keeperCry(){
    idleFlags.keeper = false;
    keeper.tearL.visible = true; keeper.tearR.visible = true;
    keeper.tearL.scale.set(0.3,0.5,0.3); keeper.tearR.scale.set(0.3,0.5,0.3);
    addTween(1500, function(p){
      keeper.rig.rotation.x = 0.22 + Math.sin(p*Math.PI*7) * 0.025;
      keeper.rig.position.y = -Math.abs(Math.sin(p*Math.PI*9)) * 0.012;
      keeper.armL.rotation.z = 1.0;
      keeper.armR.rotation.z = -0.75;
      var tearP = Math.min(1, p*1.6);
      keeper.tearL.position.y = 1.53 - tearP*0.14;
      keeper.tearR.position.y = 1.53 - tearP*0.14;
      var s = 0.3 + tearP*0.5;
      keeper.tearL.scale.set(s*0.7,s*1.3,s*0.7);
      keeper.tearR.scale.set(s*0.7,s*1.3,s*0.7);
    }, function(){
      keeper.tearL.visible = false; keeper.tearR.visible = false;
      keeper.tearL.position.y = 1.53; keeper.tearR.position.y = 1.53;
      keeper.rig.rotation.x = 0;
      idleFlags.keeper = true;
    });
  }

  function playMissionClearSting(){
    if(!audioCtx) return;
    var now = audioCtx.currentTime;
    if(musicGain){ musicGain.gain.cancelScheduledValues(now); musicGain.gain.linearRampToValueAtTime(0.06, now+0.08); }
    var arp = [523.25, 659.25, 783.99, 1046.5];
    arp.forEach(function(freq,i){
      var t = now + i*0.09;
      var osc = audioCtx.createOscillator(); osc.type='square'; osc.frequency.value=freq;
      var g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(0.16,t+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
      osc.connect(g).connect(audioCtx.destination); osc.start(t); osc.stop(t+0.4);
    });
    var chordT = now + 0.42;
    [523.25,659.25,783.99].forEach(function(freq){
      var osc = audioCtx.createOscillator(); osc.type='triangle'; osc.frequency.value=freq*2;
      var g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001,chordT);
      g.gain.linearRampToValueAtTime(0.13,chordT+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,chordT+0.6);
      osc.connect(g).connect(audioCtx.destination); osc.start(chordT); osc.stop(chordT+0.65);
    });
    for(var i=0;i<6;i++){
      var t = now + 0.1 + Math.random()*0.5;
      var src = audioCtx.createBufferSource(); src.buffer = noiseBuffer(0.05);
      var bp = audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1600+Math.random()*1200; bp.Q.value=1.2;
      var g = audioCtx.createGain();
      g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
      src.connect(bp).connect(g).connect(audioCtx.destination); src.start(t);
    }
    setTimeout(function(){
      if(musicGain && !musicMuted){ musicGain.gain.cancelScheduledValues(audioCtx.currentTime); musicGain.gain.linearRampToValueAtTime(0.24, audioCtx.currentTime+0.4); }
    }, 1100);
  }

  function handleMissFollowup(){
    if(state.missionMisses > MISS_ALLOWANCE){
      afterOutcomePause(function(){
        idleFlags.keeper = false;
        addTween(1500, function(p){
          keeper.rig.position.y = Math.abs(Math.sin(p*Math.PI*3))*0.16;
          keeper.rig.rotation.z = Math.sin(p*Math.PI*3)*0.35;
          keeper.armL.rotation.z = 0.4+Math.sin(p*Math.PI*4)*1.2;
          keeper.armR.rotation.z = -0.4-Math.sin(p*Math.PI*4+1)*1.2;
        }, function(){ endGame(); });
        statusLine.textContent = 'The keeper is loving this.';
      }, 350);
    } else {
      afterOutcomePause(function(){ state.shooting=false; startRound(); }, 1100);
    }
  }

  function timeoutMiss(){
    state.shooting = true;
    idleFlags.kicker = false;
    addTween(300, function(p){ kicker.rig.rotation.y = Math.sin(p*Math.PI)*0.25; });
    state.missionMisses += 1; state.combo = 0; updateHud();
    showFxText('TOO SLOW!', 'save');
    statusLine.innerHTML = 'Too slow! <b>' + chancesLeftText() + '</b>';
    handleMissFollowup();
  }

  // ============================= game over / leaderboard =============================
  var db = null, top10 = [];
  var INSPIRE_QUOTES = [
    'Every great striker missed a hundred before they made the one that mattered.',
    'The scoreboard resets. What you learned from that miss doesn’t.',
    'Pressure is just proof you showed up for something worth trying.',
    'Champions aren’t built in comfort — they’re built one more shot at a time.',
    'A missed shot is only the end of the story if you stop writing.',
    'The keeper guesses. The striker who keeps stepping up eventually guesses right.'
  ];
  function qualifies(score){
    if(!db || score<=0) return false;
    if(top10.length < 10) return true;
    return score > top10[top10.length-1].score;
  }
  function endGame(){
    state.gameOver = true;
    playGameOverAudio();
    var isNewBest = state.score > state.best;
    if(isNewBest){ state.best = state.score; try{ localStorage.setItem(BEST_KEY, String(state.best)); }catch(e){} }
    updateHud();
    modalFlavor.textContent = 'Mission ' + (state.missionIndex+1) + ' failed — needed ' + missionTarget(state.missionIndex) + ' goals out of ' + missionAttempts(state.missionIndex) + ' shots.';
    modalQuote.textContent = '“' + INSPIRE_QUOTES[Math.floor(Math.random()*INSPIRE_QUOTES.length)] + '”';
    modalScore.textContent = state.score;
    modalBestWrap.innerHTML = '';
    if(isNewBest && state.score>0){
      var badge = document.createElement('span');
      badge.className = 'modal-best'; badge.textContent = 'NEW PERSONAL BEST';
      modalBestWrap.appendChild(badge);
    }
    modalNameWrap.innerHTML = '';
    if(qualifies(state.score)){
      var form = document.createElement('div'); form.className = 'modal-form';
      var input = document.createElement('input'); input.type='text'; input.maxLength=16; input.placeholder='Your name for the board';
      var saveBtn = document.createElement('button'); saveBtn.className='btn btn-primary'; saveBtn.type='button'; saveBtn.textContent='Save to Leaderboard';
      saveBtn.addEventListener('click', function(){
        var name = (input.value||'').trim().slice(0,16) || 'Player';
        saveBtn.disabled = true; saveBtn.textContent='Saving…';
        saveScore(name, state.score).then(function(){
          form.innerHTML = '<div class="modal-saved">Saved! You made the board as <b>'+escapeText(name)+'</b>.</div>';
        }).catch(function(){ saveBtn.disabled=false; saveBtn.textContent='Save to Leaderboard'; });
      });
      form.appendChild(input); form.appendChild(saveBtn);
      modalNameWrap.appendChild(form);
    }
    modal.classList.add('show');
  }
  function escapeText(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function resetGame(){
    state.score=0; state.combo=0; state.missionGoals=0; state.missionMisses=0; state.missionIndex=0; state.gameOver=false;
    updateHud(); modal.classList.remove('show');
    startRound();
  }
  modalRetryBtn.addEventListener('click', resetGame);
  modalLbBtn.addEventListener('click', function(){ modal.classList.remove('show'); openLb(); });

  function openLb(){ lbPanel.classList.add('show'); scrim.classList.add('show'); }
  function closeLb(){ lbPanel.classList.remove('show'); scrim.classList.remove('show'); }
  lbOpenBtn.addEventListener('click', openLb);
  lbCloseBtn.addEventListener('click', closeLb);
  scrim.addEventListener('click', closeLb);

  function renderLb(){
    lbList.innerHTML = '';
    if(!db){ var u=document.createElement('li'); u.className='lb-unavail'; u.textContent='Leaderboard is temporarily unavailable — check back soon.'; lbList.appendChild(u); return; }
    if(top10.length===0){ var e=document.createElement('li'); e.className='lb-empty'; e.textContent='No scores yet — be the first on the board.'; lbList.appendChild(e); return; }
    top10.forEach(function(entry,i){
      var li=document.createElement('li'); li.className='lb-row'; li.setAttribute('data-rank',String(i+1));
      var rank=document.createElement('span'); rank.className='lb-rank'; rank.textContent=String(i+1);
      var name=document.createElement('span'); name.className='lb-name'; name.textContent=entry.name||'Player';
      var score=document.createElement('span'); score.className='lb-score'; score.textContent=entry.score;
      li.appendChild(rank); li.appendChild(name); li.appendChild(score);
      lbList.appendChild(li);
    });
  }
  function saveScore(name,score){
    if(!db) return Promise.reject(new Error('no db'));
    return db.collection('leaderboard').add({ name:name, score:score, createdAt: Date.now() });
  }
  function initDb(){
    try{
      var firebaseConfig = {
        apiKey: "AIzaSyAp01EsYeb1EVzZ_eBL2UH6tLGdMG4vTig",
        authDomain: "thayagames.firebaseapp.com",
        projectId: "thayagames",
        storageBucket: "thayagames.firebasestorage.app",
        messagingSenderId: "460497963916",
        appId: "1:460497963916:web:e5dd4a60f02e1a52cea4a9"
      };
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    }catch(e){ db = null; }
    if(!db){ renderLb(); return; }
    db.collection('leaderboard').orderBy('score','desc').limit(10).onSnapshot(function(snap){
      top10 = snap.docs.map(function(d){ var v=d.data()||{}; return { name:v.name, score:v.score||0 }; });
      renderLb();
    }, function(){ renderLb(); });
  }
  initDb();
  renderLb();

  setTimeout(function(){ startRound(); }, 500);
})();
</script>
